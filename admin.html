<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProSell Admin Ultimate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    * { box-sizing: border-box; outline: none; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

    /* HEADER */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; } 
    .logo span { color: var(--primary); }
    .auth { display: flex; gap: 8px; }
    .inp-token { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; width: 140px; font-size: 14px; }
    .btn-auth { padding: 10px 16px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }
    
    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); }
    .stat-val { font-size: 28px; font-weight: 800; display: block; margin-bottom: 4px; color: var(--text); }
    .stat-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* NAVIGATION */
    .nav { display: flex; background: #E5E7EB; padding: 4px; border-radius: 10px; margin-bottom: 24px; }
    .nav-btn { flex: 1; padding: 12px; border: none; background: transparent; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .nav-btn.active { background: #fff; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

    .view { display: none; } .view.active { display: block; }

    /* ORDERS VIEW */
    .ord-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .ot-btn { padding: 8px 16px; background: #fff; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--muted); transition: 0.2s; }
    .ot-btn.active { background: #1F2937; color: #fff; border-color: #1F2937; }

    .ord-card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .ord-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #F3F4F6; }
    .ord-id { font-weight: 700; font-family: monospace; font-size: 15px; }
    .ord-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #E0F2FE; color: #0284C7; text-transform: uppercase; }
    
    .ord-row { display: flex; gap: 12px; margin-bottom: 8px; font-size: 14px; align-items: center; color: var(--text); }
    .ord-row i { color: var(--muted); width: 20px; text-align: center; }
    
    /* RESTORED COMMENT BOX */
    .ord-comment { background: #FEF3C7; color: #92400E; padding: 12px; border-radius: 8px; font-size: 13px; margin: 12px 0; border: 1px solid #FDE68A; line-height: 1.4; }
    .ord-comment i { margin-right: 6px; }

    .ord-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #F3F4F6; }
    .ord-total { font-size: 18px; font-weight: 800; }
    
    .btn-act { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: 0.2s; }
    .btn-act:hover { background: #F9FAFB; }
    .btn-green { background: #DCFCE7; color: #166534; border-color: #86EFAC; }
    .btn-green:hover { background: #BBF7D0; }

    /* PRODUCTS VIEW */
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .prod-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border); transition: transform 0.2s; }
    .prod-card:hover { transform: translateY(-2px); }
    
    .prod-img { height: 160px; background: #F9FAFB; display: flex; align-items: center; justify-content: center; position: relative; }
    .prod-img img { width: 100%; height: 100%; object-fit: cover; }
    .prod-no-img { font-size: 32px; color: #D1D5DB; }
    
    .prod-body { padding: 12px; }
    .prod-title { font-weight: 700; font-size: 14px; line-height: 1.3; margin-bottom: 8px; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .prod-price { font-weight: 800; color: var(--primary); font-size: 16px; }

    /* MODAL */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    .modal.active { display: flex; }
    .modal-box { background: #fff; width: 100%; max-width: 500px; border-radius: 20px; padding: 24px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    
    .form-group { margin-bottom: 16px; }
    .form-lbl { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .form-in { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; transition: 0.2s; }
    .form-in:focus { border-color: var(--primary); outline: none; ring: 2px solid #BFDBFE; }
    
    .img-up { height: 180px; border: 2px dashed #D1D5DB; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #F9FAFB; cursor: pointer; transition: 0.2s; }
    .img-up:hover { border-color: var(--primary); background: #EFF6FF; }
    .img-up img { width: 100%; height: 100%; object-fit: contain; }
    .img-up.loading::after { content:"Загрузка..."; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--primary); }

    .modal-acts { display: flex; gap: 10px; margin-top: 24px; }
    .btn-lg { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-save { background: var(--primary); color: #fff; }
    .btn-save:hover { background: var(--primary-dark); }
    .btn-del { background: #FEE2E2; color: #991B1B; }
    .btn-del:hover { background: #FECACA; }

    .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); cursor: pointer; transition: 0.2s; }
    .fab:hover { transform: scale(1.05); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="logo">PRO<span>SELL</span> Admin</div>
    <div class="auth">
      <input id="token" type="password" class="inp-token" placeholder="Token" />
      <button class="btn-auth" onclick="Auth.login()">Go</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <span class="stat-val" id="st-total">0</span>
      <span class="stat-lbl">Всего</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="st-new" style="color:var(--primary)">0</span>
      <span class="stat-lbl">Новых</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="st-sum" style="color:#10B981">0</span>
      <span class="stat-lbl">Выручка</span>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="Nav.to('orders')">Заказы</button>
    <button class="nav-btn" onclick="Nav.to('products')">Товары</button>
  </div>

  <div id="view-orders" class="view active">
    <div class="ord-tabs">
      <button class="ot-btn active" onclick="Orders.tab('new', this)">Входящие</button>
      <button class="ot-btn" onclick="Orders.tab('work', this)">В работе</button>
      <button class="ot-btn" onclick="Orders.tab('done', this)">История</button>
    </div>
    <button onclick="Orders.load()" class="btn-act" style="width:100%;margin-bottom:20px;padding:12px;background:#fff">Обновить список</button>
    <div id="orders-list"></div>
  </div>

  <div id="view-products" class="view">
    <div class="prod-grid" id="products-list"></div>
    <div class="fab" onclick="Products.edit({})">+</div>
  </div>
</div>

<div id="modal-prod" class="modal">
  <div class="modal-box">
    <h3 style="margin-top:0; margin-bottom:20px">Товар</h3>
    
    <div class="form-group">
      <div class="img-up" id="p-img-box" onclick="document.getElementById('p-file').click()">
        <span id="p-ph" style="color:#9CA3AF;text-align:center"><i class="fa-solid fa-cloud-arrow-up" style="font-size:24px;display:block;margin-bottom:8px"></i>Загрузить фото</span>
        <img id="p-prev" style="display:none" />
      </div>
      <input type="file" id="p-file" style="display:none" onchange="Products.upload(this)" />
      <input type="hidden" id="p-img-url" />
    </div>

    <input type="hidden" id="p-id" />
    
    <div class="form-group">
      <label class="form-lbl">Название товара</label>
      <input id="p-title" class="form-in" placeholder="Например: Процессор Intel..." />
    </div>
    
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label class="form-lbl">Цена (₽)</label>
        <input type="number" id="p-price" class="form-in" placeholder="0" />
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-lbl">Старая цена</label>
        <input type="number" id="p-old" class="form-in" placeholder="0" />
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-lbl">Категория</label>
      <select id="p-cat" class="form-in"></select>
    </div>
    
    <div class="form-group">
      <label class="form-lbl">Описание</label>
      <textarea id="p-desc" class="form-in" rows="4" placeholder="Текст описания..."></textarea>
    </div>

    <div class="modal-acts">
      <button class="btn-lg" style="background:#F3F4F6;color:#374151" onclick="UI.modal('prod', false)">Отмена</button>
      <button class="btn-lg btn-save" onclick="Products.save()">Сохранить</button>
    </div>
    <button onclick="Products.del()" style="width:100%;margin-top:15px;padding:12px;border:none;color:#EF4444;background:none;cursor:pointer;font-weight:600">Удалить товар</button>
  </div>
</div>

<script src="api.js"></script>
<script>
const LS_KEY="ps_adm_token_full";
let DATA={orders:[], products:[], categories:[]};
let CFG={tab:'new'};

const UI={
  id: x=>document.getElementById(x),
  modal: (n,s)=>UI.id('modal-'+n).classList.toggle('active', s),
  fmt: n=>new Intl.NumberFormat('ru-RU').format(n||0)
};

const Auth={
  init: ()=>{ const t=localStorage.getItem(LS_KEY); if(t){ UI.id('token').value=t; Auth.login(); } },
  login: ()=>{ localStorage.setItem(LS_KEY, UI.id('token').value); Orders.load(); Products.load(); }
};

const Nav={
  to: v=>{
    document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
    UI.id('view-'+v).classList.add('active');
    const idx = v==='orders'?0:1;
    document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  }
};

const Orders={
  tab: (t,el)=>{
    CFG.tab=t;
    document.querySelectorAll('.ot-btn').forEach(e=>e.classList.remove('active'));
    el.classList.add('active');
    Orders.render();
  },
  load: async ()=>{
    const res=await API.adminGetOrders(UI.id('token').value);
    if(res&&res.ok){ DATA.orders=res.orders; Stats.upd(); Orders.render(); }
  },
  render: ()=>{
    const list=UI.id('orders-list');
    const items=DATA.orders.filter(o=>{
      if(CFG.tab==='new') return o.status==='new';
      if(CFG.tab==='work') return ['in_work','assembled','shipped'].includes(o.status);
      return ['done','archived','canceled'].includes(o.status);
    });
    
    if(!items.length) { list.innerHTML='<div style="text-align:center;padding:60px;color:#9CA3AF">Здесь пусто</div>'; return; }

    list.innerHTML=items.map(o=>{
      let acts='';
      if(CFG.tab==='new') acts=`<button class="btn-act btn-green" onclick="Orders.set('${o.order_id}','in_work')">Принять в работу</button>`;
      else if(CFG.tab==='work') acts=`
        <button class="btn-act" onclick="Orders.set('${o.order_id}','assembled')">Собран</button>
        <button class="btn-act" onclick="Orders.set('${o.order_id}','shipped')">Отправлен</button>
        <button class="btn-act btn-green" onclick="Orders.set('${o.order_id}','done')">Готов</button>
        <button class="btn-act" style="color:#EF4444;border-color:#FECACA" onclick="Orders.set('${o.order_id}','canceled')">Отмена</button>
      `;
      else acts=`<button class="btn-act" onclick="Orders.set('${o.order_id}','in_work')">Вернуть в работу</button>`;
      if(CFG.tab!=='new' && o.status!=='archived') acts+=`<button class="btn-act" style="margin-left:5px" onclick="Orders.set('${o.order_id}','archived')">В архив</button>`;

      // Блок адреса (восстановлен)
      const addressBlock = (o.city || o.comment) ? 
        `<div class="ord-comment"><i class="fa-solid fa-location-dot"></i> ${o.comment || o.city}</div>` : '';

      // Товары
      const itemsHtml = (o.items||[]).map(i=> `<div>• ${i.name} <b>x${i.qty}</b></div>`).join('');

      return `
        <div class="ord-card">
          <div class="ord-head"><span>#${o.order_id}</span><span class="ord-badge">${o.status}</span></div>
          <div class="ord-row"><i class="fa-solid fa-user"></i> <b>${o.name}</b></div>
          <div class="ord-row"><i class="fa-solid fa-phone"></i> <a href="tel:${o.phone}">${o.phone}</a></div>
          
          ${addressBlock}
          
          <div style="background:#F9FAFB;padding:10px;border-radius:8px;font-size:13px;margin:10px 0">${itemsHtml || 'Нет товаров'}</div>

          <div class="ord-foot">
            <div class="ord-total">${UI.fmt(o.total)} ₽</div>
            <div style="display:flex;gap:5px">${acts}</div>
          </div>
        </div>
      `;
    }).join('');
  },
  set: async (id,st)=>{
    if(st!=='archived' && !confirm('Изменить статус?')) return;
    await API.adminUpdateOrderStatus(UI.id('token').value, id, st);
    Orders.load();
  }
};

const Products={
  load: async ()=>{
    const res=await API.fetchJson('admin_products', {params:{token:UI.id('token').value}});
    if(res&&res.ok){ DATA.products=res.products; DATA.categories=res.categories; Products.render(); }
  },
  render: ()=>{
    const list=UI.id('products-list');
    list.innerHTML=DATA.products.map(p=>`
      <div class="prod-card" onclick='Products.edit(${JSON.stringify(p)})'>
        <div class="prod-img">${p.image_url?`<img src="${p.image_url}">`:'<i class="fa-regular fa-image prod-no-img"></i>'}</div>
        <div class="prod-body">
          <div class="prod-title">${p.title}</div>
          <div class="prod-price">${UI.fmt(p.price)} ₽</div>
        </div>
      </div>
    `).join('');
  },
  edit: (p)=>{
    UI.id('p-id').value=p.id||"";
    UI.id('p-title').value=p.title||"";
    UI.id('p-price').value=p.price||"";
    UI.id('p-old').value=p.old_price||"";
    UI.id('p-img-url').value=p.image_url||"";
    // ОПИСАНИЕ: Берем из поля desc, которое бэкенд наполнит из specs
    UI.id('p-desc').value=p.desc||""; 
    
    if(p.image_url){ UI.id('p-prev').src=p.image_url; UI.id('p-prev').style.display='block'; UI.id('p-ph').style.display='none'; }
    else{ UI.id('p-prev').style.display='none'; UI.id('p-ph').style.display='block'; }
    
    UI.id('p-cat').innerHTML='<option value="">Без категории</option>'+DATA.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    UI.id('p-cat').value=p.category_id||p.category||"";
    
    UI.modal('prod',true);
  },
  upload: async (el)=>{
    const file=el.files[0]; if(!file) return;
    UI.id('p-img-box').classList.add('loading');
    
    const r=new FileReader();
    r.onload=function(e){
      const img=new Image();
      img.onload=async()=>{
        const cvs=document.createElement('canvas'), ctx=cvs.getContext('2d');
        const MAX=1200; let w=img.width, h=img.height;
        if(w>h && w>MAX){ h*=MAX/w; w=MAX; } else if(h>MAX){ w*=MAX/h; h=MAX; }
        cvs.width=w; cvs.height=h; ctx.drawImage(img,0,0,w,h);
        
        const b64=cvs.toDataURL('image/jpeg',0.8).split(',')[1];
        
        const res=await API.fetchJson('admin_upload_image',{method:'POST',body:{token:UI.id('token').value, data:b64}});
        UI.id('p-img-box').classList.remove('loading');
        
        if(res.ok){ 
           UI.id('p-img-url').value=res.url; 
           UI.id('p-prev').src=res.url; 
           UI.id('p-prev').style.display='block'; 
           UI.id('p-ph').style.display='none';
        } else { 
           alert("ОШИБКА: "+res.error); 
        }
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  },
  save: async ()=>{
    const item={
      id:UI.id('p-id').value, 
      title:UI.id('p-title').value,
      price:UI.id('p-price').value, 
      old_price:UI.id('p-old').value,
      category:UI.id('p-cat').value, 
      image_url:UI.id('p-img-url').value,
      desc:UI.id('p-desc').value, // Передаем описание
      in_stock:true
    };
    
    if(!item.title) return alert("Введите название");
    const btn=document.querySelector('.btn-save'); 
    const oldT=btn.innerText; btn.innerText="Сохранение...";
    
    const res=await API.fetchJson('admin_save_product',{method:'POST',body:{token:UI.id('token').value, item}});
    btn.innerText=oldT;
    
    if(res.ok) {
       UI.modal('prod',false); Products.load();
    } else {
       alert("Ошибка сохранения: " + res.error);
    }
  },
  del: async ()=>{
    if(confirm('Удалить товар?')){
      await API.fetchJson('admin_delete_product',{method:'POST',body:{token:UI.id('token').value, id:UI.id('p-id').value}});
      UI.modal('prod',false); Products.load();
    }
  }
};

const Stats={
  upd: ()=>{
    const tot=DATA.orders.length;
    const nw=DATA.orders.filter(o=>o.status==='new').length;
    // Считаем выручку за сегодня
    const today = new Date().toDateString();
    const sum=DATA.orders.reduce((a,o)=>(new Date(o.ts).toDateString()===today ? a+Number(o.total) : a),0);
    
    UI.id('st-total').innerText=tot; 
    UI.id('st-new').innerText=nw; 
    UI.id('st-sum').innerText=UI.fmt(sum);
  }
};

Auth.init();
</script>
</body>
</html>
